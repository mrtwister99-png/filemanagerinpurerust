# Android 15+ pouziva 16KB stranky pameti: nativni knihovny musi byt zarovnane na 16 KB.
# NDK r27 to nedela samo (az r28), proto tento linker flag.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
