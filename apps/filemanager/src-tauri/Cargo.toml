[package]
name = "filemanager"
version = "0.1.0"
edition = "2021"

# Android potrebuje knihovnu (cdylib), desktop spousti main.rs, ktery vola stejny kod
[lib]
name = "filemanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
filecore = { path = "../../../crates/filecore" }
